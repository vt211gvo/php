services:
  ###> doctrine/doctrine-bundle ###
  hostel-laravel-db:
    platform: linux/amd64
    image: mysql:5.7
    volumes:
      - hostel-db-laravel-data:/var/lib/mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: hostel-laravel-db
      MYSQL_PASSWORD: password
    networks:
      - hostel-laravel-net

  hostel-laravel-phpmyadmin:
    depends_on:
      - hostel-laravel-db
    image: phpmyadmin
    restart: always
    ports:
      - "8090:80"
    environment:
      PMA_HOST: hostel-laravel-db
      MYSQL_ROOT_PASSWORD: password
    networks:
      - hostel-laravel-net

networks:
  hostel-laravel-net:

volumes:
  hostel-db-laravel-data:
